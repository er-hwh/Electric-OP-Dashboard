{% extends "base.html" %}

{% block title %}Direct Message | Officer Console{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="rail-card p-4">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <div>
                        <span class="badge bg-primary mb-1 fs-6"><i class="fa-solid fa-envelope me-1"></i> Official Communication</span>
                        <h4 class="fw-bold text-dark mb-0">Send Direct Message to Running Staff or CLI</h4>
                        <small class="text-muted">Direct communication channel from Divisional Officer</small>
                    </div>
                    <a href="{{ url_for('officer.dashboard') }}" class="btn btn-outline-secondary btn-sm">
                        <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
                    </a>
                </div>

                <form method="POST" action="{{ url_for('officer.direct_message') }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-dark">Select Recipient <span class="text-danger">*</span></label>
                        <select name="recipient_id" class="form-select" required>
                            <option value="">-- Choose Running Staff or CLI --</option>
                            <optgroup label="Chief Loco Inspectors (CLIs)">
                                {% for c in clis %}
                                    <option value="{{ c.id }}">CLI: {{ c.full_name }} ({{ c.username }}{% if c.lobby %} - {{ c.lobby.code }}{% endif %})</option>
                                {% endfor %}
                            </optgroup>
                            <optgroup label="Running Staff (Crews)">
                                {% for cr in crews %}
                                    <option value="{{ cr.id }}">{{ cr.sub_role }}: {{ cr.full_name }} (Mob: {{ cr.mobile }}{% if cr.lobby %} - {{ cr.lobby.code }}{% endif %})</option>
                                {% endfor %}
                            </optgroup>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-dark">Subject <span class="text-danger">*</span></label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Inquiry regarding Loco failure on 12-Oct-2026 / Performance Appreciation" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-dark">Message Content <span class="text-danger">*</span></label>
                        <textarea name="body" class="form-control" rows="5" placeholder="Enter message or directive..." required></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fs-6 fw-bold shadow-sm">
                            <i class="fa-solid fa-paper-plane me-1"></i> Transmit Message
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
